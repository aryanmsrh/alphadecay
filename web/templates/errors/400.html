{% extends "base.html" %}

{% block topbar_title %}400 BAD REQUEST{% endblock %}

{% block content %}
<div class="empty-state" style="padding: 60px 20px;">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="8" x2="12" y2="12"></line>
    <line x1="12" y1="16" x2="12.01" y2="16"></line>
  </svg>
  <h2>Invalid Request Parameters</h2>
  <p>{{ message or "The submitted parameters could not be validated by the investigation service." }}</p>
  <div style="display: flex; gap: 10px; justify-content: center; margin-top: 18px;">
    <a href="{{ url_for('new_investigation_page') }}" class="btn btn-primary">Try Again</a>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Dashboard</a>
  </div>
</div>
{% endblock %}
