{% extends "base.html" %}

{% block content %}
<div class="empty-state" style="padding: 60px 24px; max-width: 620px; margin: 60px auto;">
  <div style="font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; color: var(--accent-yellow); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 14px;">
    HTTP 400 // INVALID PARAMETERS
  </div>
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--accent-yellow); margin-bottom: 16px;">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="8" x2="12" y2="12"></line>
    <line x1="12" y1="16" x2="12.01" y2="16"></line>
  </svg>
  <h2>Invalid Request Parameters</h2>
  <p>{{ message or "The submitted parameters could not be validated by the investigation service." }}</p>
  <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px;">
    <a href="{{ url_for('new_investigation_page') }}" class="btn btn-primary btn-sm">Try Again</a>
    <a href="{{ url_for('index') }}" class="btn btn-secondary btn-sm">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
