{% extends "base.html" %}

{% block topbar_title %}404 NOT FOUND{% endblock %}

{% block content %}
<div class="empty-state" style="padding: 60px 20px;">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="8" x2="12" y2="12"></line>
    <line x1="12" y1="16" x2="12.01" y2="16"></line>
  </svg>
  <h2>Resource Not Found</h2>
  <p>{{ message or "The requested investigation run or artifact could not be located." }}</p>
  <div style="display: flex; gap: 10px; justify-content: center; margin-top: 18px;">
    <a href="{{ url_for('index') }}" class="btn btn-primary">Dashboard</a>
    <a href="{{ url_for('investigations_history_page') }}" class="btn btn-secondary">Investigation History</a>
  </div>
</div>
{% endblock %}
